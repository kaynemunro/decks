<script>(function () {
  const cfg = JSON.parse(document.getElementById("deck-payload").textContent);
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-password");
  const statusEl = document.getElementById("gate-status");
  const button = document.getElementById("gate-submit");

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

  async function openDeck(password) {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
    );
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b64(cfg.salt), iterations: cfg.iterations, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    // A wrong password derives a wrong key, which fails the GCM tag and throws.
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(cfg.iv) }, key, b64(cfg.payload)
    );
    return new TextDecoder().decode(plain);
  }

  function reveal(deckHtml) {
    const frame = document.createElement("iframe");
    frame.setAttribute("title", cfg.title);
    frame.setAttribute("allowfullscreen", "");
    frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;margin:0";
    frame.srcdoc = deckHtml;
    document.body.textContent = "";
    document.body.appendChild(frame);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = input.value;
    if (!password) return;
    button.disabled = true;
    // Deriving takes a visible beat on a phone — say so rather than looking
    // broken. That cost is also exactly what makes guessing expensive.
    statusEl.textContent = "Unlocking…";
    statusEl.className = "gate-status gate-status--busy";
    try {
      const deckHtml = await openDeck(password);
      statusEl.textContent = "Unlocked.";
      reveal(deckHtml);
    } catch {
      button.disabled = false;
      statusEl.textContent = "That password isn't right. Try again.";
      statusEl.className = "gate-status gate-status--error";
      input.select();
    }
  });
})();</script>
