<script>(function () {
  const cfg = JSON.parse(document.getElementById("deck-payload").textContent);
  const form = document.getElementById("gate-form");
  const input = document.getElementById("gate-password");
  const statusEl = document.getElementById("gate-status");
  const button = document.getElementById("gate-submit");

  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const aesKey = (raw) => crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);

  // One PBKDF2 derivation from whatever was typed — the slow step, done once.
  async function derive(password) {
    const material = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt: b64(cfg.salt), iterations: cfg.iterations, hash: "SHA-256" },
      material,
      256
    );
    return new Uint8Array(bits);
  }

  // A wrong key fails the GCM tag and throws.
  async function openWith(rawKey) {
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64(cfg.iv) }, await aesKey(rawKey), b64(cfg.payload)
    );
    return new TextDecoder().decode(plain);
  }

  // The deck's own password first, then each named password's wrapped copy of the key.
  async function openDeck(password) {
    const derived = await derive(password);
    try {
      return { html: await openWith(derived), slot: "primary" };
    } catch (notDeckPassword) {
      // not the deck's own password; try the named ones below
    }
    for (const s of cfg.slots || []) {
      try {
        const deckKey = new Uint8Array(await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: b64(s.iv) }, await aesKey(derived), b64(s.key)
        ));
        return { html: await openWith(deckKey), slot: s.id };
      } catch (notThisSlot) {
        // the tag did not verify, so this is not that person's password
      }
    }
    throw new Error("wrong password");
  }

  function reveal(deckHtml) {
    const frame = document.createElement("iframe");
    frame.setAttribute("title", cfg.title);
    frame.setAttribute("allowfullscreen", "");
    frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0;margin:0";
    // The deck takes the keyboard as soon as it is in, so the arrow keys and a
    // clicker work without a click on the deck first (presenter-story-step-controls).
    frame.addEventListener("load", function () {
      frame.contentWindow.focus();
    });
    frame.srcdoc = deckHtml;
    document.body.textContent = "";
    document.body.appendChild(frame);
    return frame;
  }

  // How far through the deck the viewer is, 0–100: a kit engine says so on <html>,
  // anything else is measured by how far it has been scrolled.
  function progressOf(frame) {
    try {
      const doc = frame.contentDocument;
      if (!doc) return null;
      const marked = doc.documentElement.getAttribute("data-deck-progress");
      if (marked) {
        const parts = marked.split("/");
        const at = Number(parts[0]), of = Number(parts[1]);
        if (of > 0) return (at / of) * 100;
      }
      const el = doc.scrollingElement || doc.documentElement;
      if (!el.scrollHeight) return null;
      return Math.min(100, ((el.scrollTop + frame.clientHeight) / el.scrollHeight) * 100);
    } catch (unreadable) {
      return null;
    }
  }

  function uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    const b = crypto.getRandomValues(new Uint8Array(16));
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, (x) => x.toString(16).padStart(2, "0")).join("");
    return h.slice(0, 8) + "-" + h.slice(8, 12) + "-" + h.slice(12, 16) + "-" + h.slice(16, 20) + "-" + h.slice(20);
  }

  // The section on screen, as { at, of }: a slide engine says so on <html>; in a
  // scrolling deck it is the top-level <section> crossing the middle of the view.
  function sectionOf(frame) {
    try {
      const doc = frame.contentDocument;
      if (!doc) return null;
      const marked = doc.documentElement.getAttribute("data-deck-progress");
      if (marked) {
        const parts = marked.split("/");
        const at = Number(parts[0]), of = Number(parts[1]);
        return Number.isInteger(at) && Number.isInteger(of) && at >= 1 && at <= of ? { at: at - 1, of: of } : null;
      }
      const list = Array.from(doc.querySelectorAll("section")).filter((s) => !s.parentElement || !s.parentElement.closest("section"));
      const mid = frame.clientHeight / 2;
      const at = list.findIndex((s) => { const r = s.getBoundingClientRect(); return r.top <= mid && r.bottom > mid; });
      return at < 0 ? null : { at: at, of: list.length };
    } catch (unreadable) {
      return null;
    }
  }

  // View events: opened, still watching (every beat while visible), closed.
  function track(frame, slot) {
    const t = cfg.tracking;
    if (!t) return;
    const session = uuid();
    const ua = navigator.userAgent;
    const device = /iPad|Tablet/i.test(ua) ? "tablet" : /Mobi|Android|iPhone/i.test(ua) ? "mobile" : "desktop";
    let seconds = 0, furthest = 0, last = Date.now(), perSection = null;
    const tick = () => {
      const now = Date.now();
      const watched = document.visibilityState === "visible" ? (now - last) / 1000 : 0;
      seconds += watched;
      last = now;
      const p = progressOf(frame);
      if (p !== null) furthest = Math.max(furthest, p);
      const s = sectionOf(frame);
      if (!s || !(s.of <= t.maxSections)) return;
      // A deck whose section count changes mid-view starts its tally again rather
      // than credit time to sections that have moved.
      if (!perSection || perSection.length !== s.of) perSection = new Array(s.of).fill(0);
      perSection[s.at] += watched;
    };
    const send = (event, keepalive) => {
      fetch(t.url + "/rest/v1/onenz_deck_views", {
        method: "POST",
        keepalive: !!keepalive,
        headers: { apikey: t.key, "Content-Type": "application/json", Prefer: "return=minimal" },
        body: JSON.stringify({
          deck_slug: t.slug, slot: slot, session_id: session, event: event, device: device,
          seconds: Math.min(86400, Math.round(seconds)), progress: Math.min(100, Math.round(furthest)),
          sections: perSection && perSection.map((v) => Math.min(86400, Math.round(v))),
        }),
      }).catch(() => {
        // a lost view event must never get in the way of someone reading the deck
      });
    };
    send("open");
    setInterval(tick, 2000);
    setInterval(() => { tick(); if (document.visibilityState === "visible") send("beat"); }, t.beatSeconds * 1000);
    document.addEventListener("visibilitychange", () => { tick(); if (document.visibilityState === "hidden") send("beat", true); });
    addEventListener("pagehide", () => { tick(); send("close", true); });
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const password = input.value;
    if (!password) return;
    button.disabled = true;
    // Deriving takes a visible beat on a phone — say so rather than looking
    // broken. That cost is also exactly what makes guessing expensive.
    statusEl.textContent = "Unlocking…";
    statusEl.className = "gate-status gate-status--busy";
    let opened;
    try {
      opened = await openDeck(password);
    } catch (wrong) {
      button.disabled = false;
      statusEl.textContent = "That password isn't right. Try again.";
      statusEl.className = "gate-status gate-status--error";
      input.select();
      return;
    }
    statusEl.textContent = "Unlocked.";
    track(reveal(opened.html), opened.slot);
  });
})();</script>
